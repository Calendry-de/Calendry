services:
  calendry-app:
    image: ghcr.io/calendry-de/calendry:latest
    container_name: calendry-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NITRO_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      # curl, not wget: the runner image (`.config/Dockerfile`) never installed
      # wget, only curl (via the base image / apt), so this healthcheck has
      # been failing outright ("wget: not found") since #92 gave `/health`
      # something worth checking — Docker reported the container unhealthy
      # while `/health` itself answered correctly. `-f` makes curl exit
      # non-zero on a non-2xx response (the 503 `/health` now returns when
      # degraded), matching wget's default failure behaviour.
      test:
          - CMD-SHELL
          - 'curl -fsS http://127.0.0.1:3000/health || exit 1'
      interval: 30s
      timeout: 20s
      retries: 10
  solver:
    # Same shape as calendry-app: a published image in production, built from
    # the vendored submodule by the dev override.
    image: ghcr.io/calendry-de/calendry-solver:latest
    container_name: calendry-solver
    environment:
      - CALENDRY_SOLVER_ADDR=0.0.0.0:50051
    restart: unless-stopped

  db:
    image: 'postgres:18.1-alpine'
    container_name: calendry-db
    # Matches calendry-app and solver, which both had it while the database they
    # depend on did not. That asymmetry is the failure mode, not a missing nicety:
    # when the db stopped (host sleep, daemon restart, OOM) nothing brought it
    # back, while the two dependents restarted forever against a database that was
    # never coming — `Error: P1001: Can't reach database server at db:5432`, on a
    # loop, indefinitely.
    #
    # The loop also has a second-order effect worth knowing, because `up -d` does
    # NOT fix it: a container that keeps restarting while its network is recreated
    # ends up with a stale endpoint and NO network at all, and starting an existing
    # container does not rebuild one. The symptom is identical (P1001) but the
    # cause is not, and the cure is `up -d --force-recreate <service>`.
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - ./.config/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 5s
      timeout: 20s
      retries: 10
    env_file:
      - .env

  redis:
    # Cache for issue #66 — a read-through cache for calendar reads,
    # invalidated on schedule changes (server/utils/cache.ts). Never the
    # database of record: every key it holds is disposable, so a lost
    # `redis_data` volume degrades reads back to hitting Postgres directly
    # rather than losing anything.
    image: 'redis:7-alpine'
    container_name: calendry-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" role="img" aria-label="Calendry">
  <title>Calendry</title>
  <!--
    The 11C mark alone — no wordmark. A tab strip shows this at 16px, where
    lettering is a smudge and the C's counter is the only thing that survives.

    Drawn at the SMALL stroke weights (20/6/6, not the 18/5/5.5 of the large
    lockup), for the reason the component carries both sets: scaled down, the
    large weights go spindly and the three agenda rows close up into one grey
    bar.

    Ink follows the viewer's browser theme. `#1A2230` is the design's ink and
    is all but invisible against a dark tab strip (Chrome's is #202124), so a
    dark-scheme override lifts it to the app's own dark-theme content colour.
    The accent holds its value in both — it is the brand, and it carries on
    either ground. SVG favicons are the only icon format that can do this,
    which is why the raster fallbacks below get an opaque tile instead.
  -->
  <style>
    .ink { stroke: #1A2230; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #F7F7FA; }
    }
  </style>
  <path class="ink" d="M79.5 70.7 A36 36 0 1 1 79.5 29.3" stroke="#1A2230" stroke-width="20"/>
  <path class="ink" d="M37 41 L62 41" stroke="#1A2230" stroke-width="6" stroke-linecap="round"/>
  <path class="ink" d="M37 50 L53 50" stroke="#1A2230" stroke-width="6" stroke-linecap="round"/>
  <path d="M37 59 L59 59" stroke="#2F9E8F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="59" cy="59" r="6" fill="#2F9E8F"/>
</svg>

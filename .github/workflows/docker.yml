name: Build Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun install fetches @calendry-de/calendry-proto from GitHub Packages.
      # PACKAGES_READ_TOKEN must be a CLASSIC PAT with read:packages — the
      # registry refuses fine-grained tokens. Written outside the build context
      # and passed as a BuildKit secret so it never lands in a layer.
      - name: Write registry credential
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          install -d "${RUNNER_TEMP}/registry"
          printf '[install.scopes]\n"@calendry-de" = { token = "%s", url = "https://npm.pkg.github.com/" }\n' \
            "${PACKAGES_TOKEN}" > "${RUNNER_TEMP}/registry/bunfig.toml"

          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${PACKAGES_TOKEN}" \
            https://npm.pkg.github.com/@calendry-de%2fcalendry-proto || echo 000)"

          if [ "$STATUS" != "200" ]; then
            echo "::error::registry rejected the token (HTTP ${STATUS}). Set PACKAGES_READ_TOKEN to a classic PAT with read:packages."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .config/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # secret-files, not secrets: the latter takes inline values, so a
          # path there is passed through as a literal string.
          secret-files: |
            bunfig=${{ runner.temp }}/registry/bunfig.toml
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint runs migrate deploy + db seed before Nitro starts, and a
      # migrated-but-unseeded database is unusable. The healthcheck cannot see
      # the seed, so the permission count is asserted separately.
      - name: Smoke test via docker-compose
        run: |
          set -euo pipefail
          FIRST_TAG="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull "$FIRST_TAG"
          fi

          docker tag "$FIRST_TAG" ghcr.io/calendry-de/calendry:latest

          OWNER_PW="$(openssl rand -hex 16)"
          APP_PW="$(openssl rand -hex 16)"

          cat > .env <<ENV
          POSTGRES_USER=calendry
          POSTGRES_PASSWORD=${OWNER_PW}
          POSTGRES_DB=calendrydb
          APP_DB_USER=calendry_app
          APP_DB_PASSWORD=${APP_PW}
          DATABASE_URL=postgresql://calendry_app:${APP_PW}@db:5432/calendrydb
          MIGRATION_DATABASE_URL=postgresql://calendry:${OWNER_PW}@db:5432/calendrydb
          CALENDRY_SOLVER_ADDR=solver:50051
          CALENDRY_SOLVER_POLL=off
          CALENDRY_SESSION_SWEEP=off
          ENV

          # db and calendry-app by name: the solver service pulls a separately
          # published image and is not needed for the app to boot.
          docker compose -f docker-compose.yml up -d db calendry-app

          for _ in $(seq 1 60); do
            STATE="$(docker inspect -f '{{ .State.Health.Status }}' calendry-app 2>/dev/null || echo starting)"
            [ "$STATE" = "healthy" ] && break
            [ "$STATE" = "unhealthy" ] && { echo "::error::container unhealthy"; exit 1; }
            sleep 5
          done

          [ "$STATE" = "healthy" ] || { echo "::error::app never became healthy"; exit 1; }

          COUNT="$(docker compose -f docker-compose.yml exec -T db \
            psql -U calendry -d calendrydb -tAc 'select count(*) from permission')"
          echo "permission rows: ${COUNT}"
          [ "${COUNT}" -ge 1 ] || { echo "::error::permission catalogue empty — db seed did not run"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
